# Reusable: plan, then WAIT for the GitHub Environment's required reviewers, then apply that exact plan.
name: apply-environment

on:
  workflow_call:
    inputs:
      env:
        type: string
        required: true
      allow_destroy:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: plan-${{ inputs.env }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # Same masked per-environment values as plan.yml: this repository is public, so logs and artifacts are public.
      - name: Load environment values (masked)
        working-directory: live/${{ inputs.env }}
        env:
          TFVARS_JSON: ${{ secrets.TFVARS_JSON }}
          ALLOW_PLACEHOLDERS: ${{ vars.ALLOW_PLACEHOLDERS }}
        run: |
          if [ -z "${TFVARS_JSON}" ]; then
            # An empty value means the secret was not passed or not set, and the committed placeholders would plan the
            # DESTRUCTION of a real environment. Refuse unless the environment is explicitly marked as placeholder-only.
            if [ "${ALLOW_PLACEHOLDERS}" = "true" ]; then echo "placeholder-only environment: planning with the committed values"; exit 0; fi
            echo "::error::TFVARS_JSON is empty for this environment. Refusing to plan with placeholder values."; exit 1
          fi
          echo "${TFVARS_JSON}" | jq -r '[.account_id, (.public_access_cidrs[]?), (.admin_role_arns[]?), (.alert_emails[]?)] | .[] | select(. != null)' \
            | while IFS= read -r v; do echo "::add-mask::${v}"; done
          echo "${TFVARS_JSON}" > zz-environment.auto.tfvars.json
      - name: terraform plan
        working-directory: live/${{ inputs.env }}
        env:
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
          STATE_KMS_KEY_ARN: ${{ vars.STATE_KMS_KEY_ARN }}
          AWS_REGION_VAR: ${{ vars.AWS_REGION }}
          TARGET_ENV: ${{ inputs.env }}
          PLAN_ARTIFACT_KEY: ${{ secrets.PLAN_ARTIFACT_KEY }}
          ALLOW_DESTROY: ${{ inputs.allow_destroy }}
          # PLAN_REFRESH=false where runners cannot reach the cluster API (see plan.yml).
          REFRESH_FLAG: ${{ vars.PLAN_REFRESH == 'false' && '-refresh=false' || '' }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${TARGET_ENV}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION_VAR}" \
            -backend-config="kms_key_id=${STATE_KMS_KEY_ARN}" \
            -backend-config="use_lockfile=true" -backend-config="encrypt=true"
          # shellcheck disable=SC2086 # REFRESH_FLAG is empty or a single flag, so it must not be quoted
          terraform plan -input=false -lock-timeout=5m ${REFRESH_FLAG} -out=tfplan
          # A saved plan contains every variable and generated secret value, and artifacts of a public repository are
          # public. Encrypt it; only the apply job holds the key.
          if [ -z "${PLAN_ARTIFACT_KEY}" ]; then echo "::error::PLAN_ARTIFACT_KEY is empty: the plan would be uploaded unprotected."; exit 1; fi
          # Show what the plan would delete, and stop unless the run was started with allow_destroy: a plan that
          # destroys part of an environment must never be applied unseen.
          terraform show -json tfplan | jq -r '.resource_changes[] | select(.change.actions | index("delete")) | "DELETE " + .address' | sed -E 's/[0-9]{12}/************/g' | tee destroys.txt
          if [ -s destroys.txt ] && [ "${ALLOW_DESTROY}" != "true" ]; then echo "::error::The plan deletes resources (listed above). Re-run with allow_destroy only if that is intended."; exit 1; fi
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:PLAN_ARTIFACT_KEY -in tfplan -out tfplan.enc
          rm tfplan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-${{ inputs.env }}
          path: live/${{ inputs.env }}/tfplan.enc
          retention-days: 3

  apply:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Approval gate: configure required reviewers on each GitHub Environment (production: at least two).
    environment: ${{ inputs.env }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }} # write role, trust bound to this environment
          aws-region: ${{ vars.AWS_REGION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-${{ inputs.env }}
          path: live/${{ inputs.env }}
      - name: terraform apply (the reviewed plan, nothing else)
        working-directory: live/${{ inputs.env }}
        env:
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
          STATE_KMS_KEY_ARN: ${{ vars.STATE_KMS_KEY_ARN }}
          AWS_REGION_VAR: ${{ vars.AWS_REGION }}
          TARGET_ENV: ${{ inputs.env }}
          PLAN_ARTIFACT_KEY: ${{ secrets.PLAN_ARTIFACT_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:PLAN_ARTIFACT_KEY -in tfplan.enc -out tfplan
          terraform init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${TARGET_ENV}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION_VAR}" \
            -backend-config="kms_key_id=${STATE_KMS_KEY_ARN}" \
            -backend-config="use_lockfile=true" -backend-config="encrypt=true"
          terraform apply -input=false -lock-timeout=5m tfplan
          rm -f tfplan
