# Infra pull request checks. Nothing here can change AWS: static analysis, then `terraform plan` with a
# read-only role. The single required check for the ruleset is "plan / gate".
# Layout: written for the split school-infra repository (repo root = school-infra/).
name: plan

on:
  pull_request:
    branches: [main]

concurrency:
  group: plan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform validate (every root module)
        run: |
          for d in bootstrap/*/ live/*/; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0
      - name: tflint
        run: |
          tflint --init
          tflint --recursive --format compact
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when downloading the AWS ruleset
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Checkov (built-in and custom policies)
        run: |
          pip install "checkov==3.4.2"
          checkov --config-file .checkov.yaml -d .
      - name: Policy unit tests (Conftest)
        run: |
          docker run --rm -v "$PWD/policies/conftest:/policy:ro" \
            openpolicyagent/conftest@sha256:0e77cdf7c1fcde035f3c579e4aaa6664ee2a8be5777eaa9af9f520cdd02280c0 \
            verify --policy /policy
      - name: Plan-time policy check (no AWS account needed)
        run: |
          policies/run.sh regulated

  plan:
    name: plan (${{ matrix.env }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Environment-scoped OIDC: the plan role trusts only this environment and can only read.
    environment: plan-${{ matrix.env }}
    strategy:
      fail-fast: false
      matrix:
        env: [dev, staging]
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }} # read-only
          aws-region: ${{ vars.AWS_REGION }}
      # Real values (account id, allowed IP, alert email) never live in the repository. They are one JSON
      # Environment secret per environment, loaded as an auto-loaded tfvars file and masked in the logs, because the
      # logs and pull request comments of a public repository are public.
      - name: Load environment values (masked)
        working-directory: live/${{ matrix.env }}
        env:
          TFVARS_JSON: ${{ secrets.TFVARS_JSON }}
        run: |
          if [ -z "${TFVARS_JSON}" ]; then echo "no TFVARS_JSON for this environment: planning with the committed placeholders"; exit 0; fi
          echo "${TFVARS_JSON}" | jq -r '[.account_id, (.public_access_cidrs[]?), (.admin_role_arns[]?), (.alert_emails[]?)] | .[] | select(. != null)' \
            | while IFS= read -r v; do echo "::add-mask::${v}"; done
          echo "${TFVARS_JSON}" > zz-environment.auto.tfvars.json
      - name: terraform plan
        working-directory: live/${{ matrix.env }}
        env:
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
          STATE_KMS_KEY_ARN: ${{ vars.STATE_KMS_KEY_ARN }}
          AWS_REGION_VAR: ${{ vars.AWS_REGION }}
          # Set the Environment variable PLAN_REFRESH=false where the cluster API is not reachable from a runner (an
          # IP-restricted or private endpoint). A refresh would then misread the Helm releases as missing and plan to
          # create them again. Drift is not detected by this plan in that case.
          REFRESH_FLAG: ${{ vars.PLAN_REFRESH == 'false' && '-refresh=false' || '' }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${{ matrix.env }}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION_VAR}" \
            -backend-config="kms_key_id=${STATE_KMS_KEY_ARN}" \
            -backend-config="use_lockfile=true" -backend-config="encrypt=true"
          # shellcheck disable=SC2086 # REFRESH_FLAG is empty or a single flag, so it must not be quoted
          terraform plan -input=false -lock-timeout=5m ${REFRESH_FLAG} -out=tfplan
          terraform show -no-color tfplan > plan.txt
          terraform show -json tfplan > plan.json
      - name: Policy check on the real plan
        working-directory: live/${{ matrix.env }}
        run: |
          docker run --rm -v "$PWD:/work" -v "$GITHUB_WORKSPACE/policies/conftest:/policy:ro" -w /work \
            openpolicyagent/conftest@sha256:0e77cdf7c1fcde035f3c579e4aaa6664ee2a8be5777eaa9af9f520cdd02280c0 \
            test plan.json --policy /policy --namespace main
      # Optional price estimate from the real plan (the plan job is the only place that has the resolved values).
      # Needs a free Infracost API key in the secret INFRACOST_API_KEY and the repository variable
      # INFRACOST_ENABLED=true; without them these two steps are skipped. Infracost receives price-related attributes
      # (resource types, sizes, region), not credentials. continue-on-error: a pricing outage must not block a PR.
      - uses: infracost/actions/setup@a5783eb98adc93aa7a0049fce0abb06fdd30770a # v5.0.1
        if: ${{ vars.INFRACOST_ENABLED == 'true' }}
        continue-on-error: true
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
      - name: Cost estimate
        if: ${{ vars.INFRACOST_ENABLED == 'true' }}
        continue-on-error: true
        working-directory: live/${{ matrix.env }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          infracost breakdown --path plan.json --format table --no-color > cost.txt
          { echo "### cost estimate: \`${{ matrix.env }}\` (monthly, Infracost)"; echo '```'; cat cost.txt; echo '```'; } > cost.md
          cat cost.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file cost.md
      - name: Comment the plan summary on the pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const plan = JSON.parse(fs.readFileSync('live/${{ matrix.env }}/plan.json', 'utf8'));
            // Addresses only: no attribute values, and any 12-digit account id is blanked. The full plan stays in the
            // (masked) job log, because a public repository's comments are readable by everyone.
            const hide = (t) => t.replace(/[0-9]{12}/g, '************');
            const changes = (plan.resource_changes || []).filter((c) => !(c.change.actions.length === 1 && c.change.actions[0] === 'no-op'));
            const lines = changes.map((c) => `- ${c.change.actions.join('/')}: \`${hide(c.address)}\``);
            const body = `### terraform plan: \`${{ matrix.env }}\`\n${changes.length} resource change(s). Addresses only; open the job log for details.\n\n${lines.slice(0, 200).join('\n') || 'No changes.'}`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

  gate:
    name: gate
    if: always()
    needs: [static, plan]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail unless every required job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - name: All required jobs succeeded
        run: echo ok
