# Apply on merge to main, one environment at a time, each behind its own approval.
# Nothing applies from a pull request, and nothing applies without a reviewer on the GitHub Environment.
name: apply

on:
  push:
    branches: [main]
    paths: ["modules/**", "live/**"]
  # Run one environment on demand, for example after changing the workflow or the role. Same gates as a push.
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to plan and apply
        type: choice
        options: [dev, staging, production]
        default: dev
      allow_destroy:
        description: Allow the plan to delete resources (leave off unless a deletion is intended)
        type: boolean
        default: false

concurrency:
  group: apply
  cancel-in-progress: false # never interrupt an apply

permissions:
  contents: read

jobs:
  manual:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_apply.yml
    secrets: inherit # TFVARS_JSON and PLAN_ARTIFACT_KEY are secrets; a called workflow does not see them otherwise
    with:
      env: ${{ inputs.environment }}
      allow_destroy: ${{ inputs.allow_destroy }}

  dev:
    if: github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_apply.yml
    secrets: inherit # TFVARS_JSON and PLAN_ARTIFACT_KEY are secrets; a called workflow does not see them otherwise
    with:
      env: dev

  staging:
    if: github.event_name == 'push'
    needs: dev
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_apply.yml
    secrets: inherit # TFVARS_JSON and PLAN_ARTIFACT_KEY are secrets; a called workflow does not see them otherwise
    with:
      env: staging

  production:
    if: github.event_name == 'push'
    needs: staging
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_apply.yml
    secrets: inherit # TFVARS_JSON and PLAN_ARTIFACT_KEY are secrets; a called workflow does not see them otherwise
    with:
      env: production
